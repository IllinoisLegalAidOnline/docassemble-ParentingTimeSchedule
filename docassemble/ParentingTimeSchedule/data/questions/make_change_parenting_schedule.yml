---
id: welcome
question: |
  Make or change a parenting time schedule
subquestion: |
  Welcome to Illinois Legal Aid Online's **Make or change a parenting time schedule** Easy Form.

  This program helps you ask the court to make or change a parenting time schedule for your children.
continue button field: sees_nav_bar
---
id: instructions
continue button field: how_to_use
question: |
  Instructions
subquestion: |
  To use this program you will need: 

  * A parenting time or visitation order from an Illinois court,
  * Information about changed circumstances if the order already has a set schedule,
  * Information about the other parent, and  
  * Information about the other parent's lawyer, if any. 

  You can find most of this information on other court papers you have about this case. 

  Set aside 10 to 20 minutes to finish this program. You can log in and save your work to continue later. 
 
  ${ collapse_template(help_example) }  

  Click on **{green words}** to learn what they mean. Some questions have a question mark in a circle ${ fa_icon("question-circle", color_css="#0dcaf0" ) } that also gives help.
---
template: help_example
subject: |
  **You can expand sections like this to show more information.**
content: |  
  This is an example of help. Click again to hide.
---
id: about parenting time
question: |
  About parenting time schedules
subquestion: |
  If you already have a parenting time schedule, you will need to show changed circumstances.

  If you have an order for parenting time or visitation but no schedule, you do not need to show changed circumstances.
continue button field: about_parenting_time
---
id: child support note
question: |
  Note about child support
subquestion: |
  Parenting time is not dependent on payment of child support. However, if you file a motion the judge may review
  your case file and issue a new support order including interest on missed payments.
continue button field: child_support_note
---
id: whats next
continue button field: whats_next
question: |
  What's next
subquestion: |
  After you download your parenting time Motion, you must file it with the court. This program **does not file** your Motion for you.
  
  You may need to schedule a court date for when the judge will hear your motion. The scheduling process is different depending on your location and case type. Check with your local circuit clerk for how to schedule a motion hearing.
  
  Finally, you will need to send your Motion and *Notice of Court Date for Motion* forms to the other parent.
  
  To learn more, read the instructions you can download at the end of this program. 
---
#### QUALIFICATION
id: is user parent
question: |
  Are you a parent of the children?
fields: 
  - no label: is_user_parent
    datatype: yesnoradio
---
id: have existing order
question: |
  Have existing parenting time/visitation order?	
subquestion: |
  Click **Yes** even if the order only says "reasonable visitation" or "parenting time."
fields: 
  - no label: has_existing_order
    datatype: yesnoradio
---
id: is order from illinois
question: |
  Is your current parenting time (visitation) order from a court in Illinois?
fields:
  - no label: is_order_from_il
    datatype: yesnoradio
---
id: is child resident
question: |
  Have the children whose parenting time you want to change lived in Illinois for the last 6 months?
subquestion: |
  Consider the six months immediately before you file. The children must have lived in Illinois for more than half of that time.
fields:
  - no label: is_child_resident
    datatype: yesnoradio
---
id: any dv
question: |
  Has the other parent gone to court or the police saying you committed domestic violence or abuse against them?
subquestion: |
  This includes filing a police report or for an Order of Protection against you.
fields:
  - no label: any_domestic_abuse
    datatype: yesnoradio
---
### KICKOUTS
id: user parent kickout
event: user_not_parent_kickout
question: |
  Sorry
subquestion: |
  You can only use this program if you are a legal parent of the children.

  Use **[Get Legal Help](https://www.illinoislegalaid.org/get-legal-help)** to find free or low-cost legal services in your area.
buttons:
  - Exit: exit
  - Restart: restart
---
id: no existing order kickout
event: no_existing_order_kickout
question: |
  Sorry
subquestion: |
  You can only use this program if you have an existing parenting time or visitation order.

  Use **[Get Legal Help](https://www.illinoislegalaid.org/get-legal-help)** to find free or low-cost legal services in your area.
buttons:
  - Exit: exit
  - Restart: restart
---
id: order not illinois kickout
event: order_not_il_kickout
question: |
  Sorry
subquestion: |
  You can only use this program if your current parenting time (visitation) order is from a court in Illinois.

  Use **[Get Legal Help](https://www.illinoislegalaid.org/get-legal-help)** to find free or low-cost legal services in your area.
buttons:
  - Exit: exit
  - Restart: restart
---
id: child not resident kickout
event: child_not_resident_kickout
question: |
  Sorry
subquestion: |
  You can only use this program if the children lived in Illinois for at least the last 6 months.

  Use **[Get Legal Help](https://www.illinoislegalaid.org/get-legal-help)** to find free or low-cost legal services in your area.
buttons:
  - Exit: exit
  - Restart: restart
---
id: domestic abuse kickout
event: domestic_abuse_kickout
question: |
  Sorry
subquestion: |
  You can only use this program if the other parent has not gone to court or the police saying you committed domestic violence or abuse against them.

  Use **[Get Legal Help](https://www.illinoislegalaid.org/get-legal-help)** to find free or low-cost legal services in your area.
buttons:
  - Exit: exit
  - Restart: restart
---
#### CHILDREN
id: children info
question: |
  About your children
subquestion: |
  Parenting time applies to all children. If the schedule differs for any child, talk with a lawyer.
continue button field: children_intro
---
code: |
  children[i].name.first
  children[i].birthdate
  children[i].lives_with_user
  children[i].complete = True
---
id: child name
sets:
  - children[i].name.first
  - children[i].name.middle
  - children[i].name.last
  - children[i].name.suffix
question: |
  % if i==0:
  What is your child's name?
  % else:
  What is your ${ ordinal(i) } child's name?
  % endif
subquestion: |
  % if i==0:
  If you have more than one child, we will ask about them on another screen.
  % endif
fields:
  - code: |
      children[i].name_fields()
---
id: child birthdate
question: |
  When was ${children[i].name_full()} born?
fields:
  - Date of birth: children[i].birthdate
    datatype: BirthDate
    alMin: ${ today().minus(days=6570).format("yyyy-MM-dd") }
    alMax: ${ today().format("yyyy-MM-dd") }
validation code: |
  if children[i].age_in_years() >= 18:
    validation_error("Only children under 18 years of age can be included.")
---
id: any more children
question: |
  Do you have any more children?
subquestion: |
  So far you have told us about ${children.full_names()}.
fields:
  - "Anyone else?": children.there_is_another
    datatype: yesnoradio
---
id: child lives with
question: |
  Does ${children[i].name_full()} live with you?
subquestion: |
  This is the child's residential address (for school enrollment purposes only).
fields:
  - no label: children[i].lives_with_user
    datatype: yesnoradio
---
code: |
  if children.number_gathered() >= 7:
    children.there_is_another = False
---
### OTHER PARENT
id: other parent intro
question: |
  About the other parent
continue button field: other_parent_intro
---
sets:
  - other_parties[0].name.first
id: other party name
question: |
