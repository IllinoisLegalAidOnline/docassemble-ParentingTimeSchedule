generic object: ALIndividual
attachment:
  variable name: x.additional_proof[i]
  name: additional_proof_of_delivery
  filename: additional_proof_of_delivery
  skip undefined: True
  editable: False
  pdf template file: proof_of_delivery.pdf
  fields:
    - "trial_court_county": ${ trial_court.address.county }
    - "plaintiffs": |
        % if party_label == 'plaintiff' or party_label == 'petitioner':
        ${ users[0].name_full() }
        % else:
        ${ other_parties[0].name_full() }
        % endif
    - "defendants": |
        % if party_label == 'plaintiff' or party_label == 'petitioner':
        ${ other_parties[0].name_full() }
        % else:
        ${ users[0].name_full() }
        % endif
    - "case_number": ${ case_number }
    - "document_name": ${ form_name }
    - "delivery_party_name_full": ${ x.name_full() }
    - "delivery_party_mailing_address": ${ x.address.on_one_line(bare=True) if x.knows_delivery_method and x.physical_delivery else "" }
    - "delivery_party_email": ${ x.delivery_email if x.knows_delivery_method and x.email_delivery else '' }
    - "delivery_party_email_efsp": ${ x.delivery_efsp_email if x.knows_delivery_method and x.efm_delivery else '' }
    - "is_delivery_party_hand_yes": ${ x.hand_delivery if x.knows_delivery_method and x.physical_delivery else '' }
    - "is_delivery_party_mail_yes": ${ x.mail_delivery if x.knows_delivery_method and x.physical_delivery else '' }
    - "is_delivery_party_efm_yes": ${ x.efm_delivery if x.knows_delivery_method else '' }
    - "is_delivery_party_email_yes": ${ x.email_delivery if x.knows_delivery_method else '' }
    - "is_delivery_party_not_electronic": ${ True if x.knows_delivery_method and x.physical_delivery else '' }
    - "delivery_party_mail_location": |
        % if x.knows_delivery_method and x.physical_delivery and x.mail_delivery:
        % if x.delivery_mail_address != "" and x.delivery_mail_city != "" and x.delivery_mail_state != "":
        ${x.delivery_mail_address }, ${x.delivery_mail_city}, ${ state_name(x.delivery_mail_state) }
        % elif x.delivery_mail_address != "" and x.delivery_mail_city != "":
        ${x.delivery_mail_address }, ${x.delivery_mail_city}
        % elif x.delivery_mail_address != "" and x.delivery_mail_state != "":
        ${x.delivery_mail_address }, ${ state_name(x.delivery_mail_state) }
        % elif x.delivery_mail_city != "" and x.delivery_mail_state != "":
        ${x.delivery_mail_city}, ${ state_name(x.delivery_mail_state) }
        % elif x.delivery_mail_address != "":
        ${x.delivery_mail_address}
        % elif x.delivery_mail_city != "":
        ${x.delivery_mail_city}
        % else:
        ${state_name(x.delivery_mail_state)}
        % endif
        % else:
        ${ "" }
        % endif
    - "is_delivery_party_jail_yes": ${ x.jail_delivery if x.knows_delivery_method and x.physical_delivery else '' }
    - "delivery_party_jail_name": |
        % if x.knows_delivery_method and x.physical_delivery and x.jail_delivery:
        % if x.delivery_jail_name and x.jail_delivery_address.on_one_line(bare=True):
        ${ x.delivery_jail_name }, ${ x.jail_delivery_address.on_one_line(bare=True) }
        % elif x.delivery_jail_name:
        ${ x.delivery_jail_name }
        % else:
        ${ x.jail_delivery_address.on_one_line(bare=True) }
        % endif
        % else:
        ${ "" }
        % endif
    - "delivery_party_date": ${ x.delivery_date if x.knows_delivery_method and x.knows_delivery_date else '' }
    - "delivery_party_time": ${ format_time(x.delivery_time, format='h:mm a') if x.knows_delivery_method and x.knows_delivery_time else '' }
    - "sign_name": ${ users[0].name_full() if e_signature else '' }
    - "e_sign_name": ${ users[0].name_full() if e_signature else '' }
    - "for_self": ${ True }
    - "user_mail_address_one_line": ${ users[0].address.on_one_line(bare=True) }
    - "user_phone_number": ${ phone_number_formatted(users[0].phone_number) }
    - "user_email": ${ users[0].email if users[0].has_email_address else '' }
---
