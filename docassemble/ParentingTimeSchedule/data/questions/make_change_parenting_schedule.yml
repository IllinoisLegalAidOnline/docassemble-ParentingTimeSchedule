fields:
  - code: |
      x.lawyer.name_fields(person_or_business='unsure')
---
code: |
  other_parent_lawyers[0].name.first
  other_parent_lawyers[0].is_represented = False
  other_parent_lawyers[i].complete = True

---
id: name of other parent lawyer
sets:
  - other_parent_lawyers[0].name.first
question: |
  Who was ${ other_parties[0].name_full() }'s lawyer?
subquestion: |
  If the court papers list a law firm instead of a person's name, select **Business or organization** and enter the law firm name. Otherwise, select **Person** and enter the name of the lawyer.
fields:
  - code: |
      other_parent_lawyers[0].name_fields(person_or_business='unsure')
---
code: |
  if other_parent_lawyers.number() == 1:
    other_parent_lawyers.there_is_another = False
---
########## SCHEDULE ############
---
id: have set schedule
question: |
  Does the parenting time or visitation order have a set schedule?
subquestion: |
  A set schedule would include:

  - Days and times when the ${ children.comma_and_list() } will be with each parent, or

  - A formula or way to determine such a schedule.

  Your answer to this question will determine if you should file a Motion to Modify Parenting Time Schedule or a Motion to Specify Parenting Time Schedule.

  If the order just says "reasonable parenting time" or "reasonable visitation," click **No**.
fields:
  - no label: have_set_schedule
    datatype: yesnoradio
  - note: |
      **Note:** Your motion will say that you and ${ other_parties[0].name_full() } have not been able to agree on consistent days and times for parenting time.
    show if:
      variable: have_set_schedule
      is: False
---
reconsider: True
depends on:
  - have_set_schedule
code: |
  form_name = "Motion to Modify Parenting Time Schedule" if have_set_schedule else "Motion to Specify Parenting Time Schedule"
---
id: changed circumstances
question: |
  Changed circumstances
subquestion: |
  If you want to change a parenting time or visitation plan, you need to tell the judge why the current plan will not work anymore.

  Your motion should explain what circumstance has changed since the last parenting time or visitation order and why changing parenting time would be in the best interest of the child.

  Be specific. If the plan used to be OK, but now your family's situation has changed, explain what has changed.

  ${ collapse_template(changed_circumstances_examples) }
fields: 
  - "Why is it in the best interests of the children to change the schedule?": changed_circumstances
    datatype: area
    maxlength: 250
    rows: 5
---
template: changed_circumstances_examples
subject: |
  **What are some examples of changed circumstances?**
content: |
  You may want to ask the Court to modify or change an existing parenting time or visitation order if:

  - A parent's work schedule has changed and they are no longer able to make the scheduled parenting times;

  - A parent has moved and the parenting time schedule is no longer working;

  - A parent has not followed the schedule written in the Parenting time order;

  - The children have gotten older and now have different needs and interests; OR

  - Any other reason that would be in the best interests of the children.
---
id: schedule_start
question: |
  When do you want the new parenting time schedule to start?
fields:
  - no label: schedule_start
    datatype: radio
    choices:
      - I will choose a start date.: specific
      - When the court orders the new schedule.: order
  - Select the start date for the new schedule: schedule_start_date
    label above field: True
    datatype: ThreePartsDate
    alMin: today()
    show if:
      variable: schedule_start
      is: specific
---
id: weekly parenting time
question: |
  Weekly parenting time
subquestion: |
  The ${form_name} will include a parenting time schedule for when each parent
  will have the children. The form breaks down the time on an hour-by-hour basis. 
  The forms allow for up to four different weekly schedules.

  ${ collapse_template(weekly_pt_schedule_example) }  
  
  You can enter up to four weekly parenting time schedules. 

  **Note:** You will be asked about parenting time schedules for holidays and school 
  breaks on other screens. The weekly schedule covers non-holidays and weeks when 
  school is in session.
continue button field: weekly_schedule
---
template: weekly_pt_schedule_example
subject: |
  **Show me the weekly parenting time schedule**
content: |  
  This is how the weekly parenting time schedule appears on the form.

  [FILE weekly_parenting_time_schedule_example.png, 100%, Weekly parenting time schedule section of forms]
---
id: parent initials
question: |
  Initials for each parent
subquestion: |
  Enter the initials for each parent. These initials will be used in the ${form_name} to identify who has parenting time.
fields:
  - ${ users[0].name_full() }: users[0].name.initials
    maxlength: 4
    default: ${ users[0].name.first[:1] + users[0].name.last[:1] }
  - ${ other_parties[0].name_full() }: other_parties[0].name.initials
    maxlength: 4
    default: ${ other_parties[0].name.first[:1] + other_parties[0].name.last[:1] }
validation code: |
  if users[0].name.initials == other_parties[0].name.initials:
    validation_error("Initials must be different.")
---
id: weekly schedule add another week
question: |
  Do you want to enter a parenting time schedule for another week?
subquestion: |
  Review what you have entered so far. You can enter up to 4 weekly schedules.

  **Initials for each parent:**

  * ${ users[0].name_full() } will use ${ users[0].name.initials } 
  * ${ other_parties[0].name_full() } will use ${ other_parties[0].name.initials }
  
  % for cnt, current_week in enumerate(week):
    ${ current_week.name}<BR>Start | Mon | Tue | Wed | Thur | Fri | Sat | Sun
    -----|-----|-----|-----|-----|-----|-----|-----
    8 AM | ${ current_week.day[0].time_8_am.name.initials } | ${ current_week.day[1].time_8_am.name.initials } | ${ current_week.day[2].time_8_am.name.initials } | ${ current_week.day[3].time_8_am.name.initials } | ${ current_week.day[4].time_8_am.name.initials } | ${ current_week.day[5].time_8_am.name.initials } | ${ current_week.day[6].time_8_am.name.initials } |
    9 AM | ${ current_week.day[0].time_9_am.name.initials } | ${ current_week.day[1].time_9_am.name.initials } | ${ current_week.day[2].time_9_am.name.initials } | ${ current_week.day[3].time_9_am.name.initials } | ${ current_week.day[4].time_9_am.name.initials } | ${ current_week.day[5].time_9_am.name.initials } | ${ current_week.day[6].time_9_am.name.initials } |
