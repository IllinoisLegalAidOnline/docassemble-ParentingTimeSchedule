id: delivery party review screen
continue button field: x.review_delivery
generic object: ALIndividual
section: Notice and delivery
question: |
  Edit delivery information for ${ x.name_full() }
subquestion: |
  Edit how and when you will deliver forms to this party.
review:
  - Edit: x.knows_delivery_method
    button: |
      **Do you know how and when you will deliver the forms?** ${ word(yesno(x.knows_delivery_method)) }
  - Edit: x.email_delivery
    button: |
      **Delivery methods:**
      % if x.email_delivery:
      Email
      % endif
      % if x.efm_delivery:
      E-filing system
      % endif
      % if x.physical_delivery:
      Paper delivery
      % endif
      % if not x.email_delivery and not x.efm_delivery and not x.physical_delivery:
      None entered
      % endif
    show if: x.knows_delivery_method
  - Edit: x.email_delivery
    button: |
      **Email delivery address:** ${ x.delivery_email if x.delivery_email else 'Not entered' }
    show if: x.knows_delivery_method and x.email_delivery
  - Edit: x.email_delivery
    button: |
      **E-filing delivery address:** ${ x.delivery_efsp_email if x.delivery_efsp_email else 'Not entered' }
    show if: x.knows_delivery_method and x.efm_delivery
  - Edit: x.email_delivery
    button: |
      **Paper delivery address:** ${ x.address.on_one_line(bare=True) or 'Not entered' }
    show if: x.knows_delivery_method and x.physical_delivery
  - Edit: x.email_delivery
    button: |
      **Hand delivery?** ${ word(yesno(x.hand_delivery)) }
      **Mail or delivery company?** ${ word(yesno(x.mail_delivery)) }
      **Mail from prison or jail?** ${ word(yesno(x.jail_delivery)) }
    show if: x.knows_delivery_method and x.physical_delivery
  - Edit: x.email_delivery
    button: |
      **Mailbox or delivery company location:**
      % if x.delivery_mail_address and x.delivery_mail_city and x.delivery_mail_state:
      ${ x.delivery_mail_address }, ${ x.delivery_mail_city }, ${ state_name(x.delivery_mail_state) }
      % elif x.delivery_mail_address and x.delivery_mail_city:
      ${ x.delivery_mail_address }, ${ x.delivery_mail_city }
      % elif x.delivery_mail_address and x.delivery_mail_state:
      ${ x.delivery_mail_address }, ${ state_name(x.delivery_mail_state) }
      % elif x.delivery_mail_city and x.delivery_mail_state:
      ${ x.delivery_mail_city }, ${ state_name(x.delivery_mail_state) }
      % elif x.delivery_mail_address:
      ${ x.delivery_mail_address }
      % elif x.delivery_mail_city:
      ${ x.delivery_mail_city }
      % elif x.delivery_mail_state:
      ${ state_name(x.delivery_mail_state) }
      % else:
      Not entered
      % endif
    show if: x.knows_delivery_method and x.physical_delivery and x.mail_delivery
  - Edit: x.email_delivery
    button: |
      **Prison or jail name and address:**
      % if x.delivery_jail_name and x.jail_delivery_address.on_one_line(bare=True):
      ${ x.delivery_jail_name }, ${ x.jail_delivery_address.on_one_line(bare=True) }
      % elif x.delivery_jail_name:
      ${ x.delivery_jail_name }
      % elif x.jail_delivery_address.on_one_line(bare=True):
      ${ x.jail_delivery_address.on_one_line(bare=True) }
      % else:
      Not entered
      % endif
    show if: x.knows_delivery_method and x.physical_delivery and x.jail_delivery
  - Edit: x.delivery_date
    button: |
      **Delivery date and time:**
      % if x.knows_delivery_date and x.knows_delivery_time:
      ${ x.delivery_date } at ${ format_time(x.delivery_time, 'h:mm a') }
      % elif x.knows_delivery_date:
      ${ x.delivery_date }; time not entered
      % elif x.knows_delivery_time:
      Date not entered; ${ format_time(x.delivery_time, 'h:mm a') }
      % else:
      Not entered
      % endif
    show if: x.knows_delivery_method
