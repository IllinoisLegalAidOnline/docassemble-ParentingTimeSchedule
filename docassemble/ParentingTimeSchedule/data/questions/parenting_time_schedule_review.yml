id: delivery party review screen
continue button field: x.review_delivery
generic object: ALIndividual
section: Notice and delivery
question: |
  Edit delivery information for ${ x.name_full() }
subquestion: |
  Edit how and when you will deliver forms to this party.
review:
  - Edit: x.knows_delivery_method
    button: |
      **Do you know how and when you will deliver the forms?** ${ word(yesno(x.knows_delivery_method)) }
  - Edit: x.email_delivery
    button: |
      **Delivery methods:**
      % if x.email_delivery:
      Email
      % endif
      % if x.physical_delivery:
      Paper delivery
      % endif
      % if not x.email_delivery and not x.physical_delivery:
      None entered
      % endif
    show if: x.knows_delivery_method
  - Edit: x.delivery_date
    button: |
      **Delivery date and time:**
      % if x.knows_delivery_date and x.knows_delivery_time:
      ${ x.delivery_date } at ${ format_time(x.delivery_time, 'h:mm a') }
      % elif x.knows_delivery_date:
      ${ x.delivery_date }; time not entered
      % elif x.knows_delivery_time:
      Date not entered; ${ format_time(x.delivery_time, 'h:mm a') }
      % else:
      Not entered
      % endif
    show if: x.knows_delivery_method
---
################ REVISIT TABLES ###################
id: children table
table: children.table
rows: children
columns:
  - Child name: |
      row_item.name.full()
  - Age: |
      row_item.age_in_years() if row_item.age_in_years() > 1 else str(row_item.age_in_months()) + ' months'
  - Lives with you?: |
      word(yesno(row_item.lives_with_user))
  - Edit name: |
      action_button_html(url_action(row_item.attr_name("name.first")), label="Edit", icon="pencil-alt")
  - Edit age: |
      action_button_html(url_action(row_item.attr_name("birthdate")), label="Edit", icon="pencil-alt")
  - Edit residence: |
      action_button_html(url_action(row_item.attr_name("lives_with_user")), label="Edit", icon="pencil-alt")
delete buttons: True
confirm: True
---
id: children review screen
continue button field: children.revisit
question: |
  Edit information about your children
subquestion: |
  ${ children.table }

  % if children.number_gathered() < 7:
  ${ children.add_action() }
  % endif
---
id: week table
table: week.table
rows: week
columns:
  - Week: |
      row_item.name
delete buttons: True
confirm: True
---
id: week review screen
continue button field: week.revisit
question: |
  Edit weekly parenting time
subquestion: |
  **Initials for each parent:**

  * ${ users[0].name.full(middle="full") } will use ${ users[0].name.initials }
  * ${ other_parties[0].name.full(middle="full") } will use ${ other_parties[0].name.initials }

  % for week_index, current_week in enumerate(week):
  **${ current_week.name }**
  % for day_index, current_day in enumerate(current_week.day):
  * ${ current_day.name }: ${ action_button_html(url_action('week[' + str(week_index) + '].day[' + str(day_index) + '].time_8_am'), label="Edit", icon="pencil-alt") }
  % endfor
  % endfor

  ${ week.table }
  % if week.number_gathered() < 4:
  ${ week.add_action() }
  % endif
---
id: holidays review screen
continue button field: holiday_list.revisit
question: |
  Edit holiday schedules
subquestion: |
  % for holiday_name, holiday_obj in holiday_objects.items():
  % if holiday_list[holiday_name]:
  * ${ holiday_name }: ${ action_button_html(url_action(holiday_obj.attr_name("holiday_year")), label="Edit", icon="pencil-alt") }
  % endif
  % endfor
---
id: additional holidays table
table: other_holidays.table
rows: other_holidays
columns:
  - Additional holiday: |
      row_item.name
  - Edit details: |
      action_button_html(url_action(row_item.attr_name("holiday_year")), label="Edit", icon="pencil-alt")
delete buttons: True
confirm: True
---
id: additional holidays review screen
continue button field: other_holidays.revisit
question: |
  Edit additional holidays
subquestion: |
  ${ other_holidays.table }

  % if other_holidays.number_gathered() < 5:
  **Note:** You can add up to five additional holidays.
  ${ other_holidays.add_action() }
  % endif
